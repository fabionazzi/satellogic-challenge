name: orbit-execution

services:
  orbit-app:
    container_name: orbit-execution-service
    image: orbit-execution-service:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../env/.env
    volumes:
      - ../src:/app/src
      - ../env:/app/env
      - ../config:/app/config
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      orbit-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - default
      - inter-service

  orbit-mysql:
    image: mysql:8.4
    container_name: orbit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orbit_executor}
      MYSQL_USER: ${MYSQL_USER:-orbit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-orbit}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: orbit-rabbitmq
    hostname: orbit-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orbit}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - default
      - inter-service
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  rabbitmq-data:

networks:
  inter-service:
    external: true
    name: satellogic
