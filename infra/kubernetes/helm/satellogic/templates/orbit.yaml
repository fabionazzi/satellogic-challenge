apiVersion: v1
kind: Secret
metadata:
  name: orbit
stringData:
  MYSQL_PASSWORD: {{ .Values.orbit.password | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orbit
data:
  MYSQL_HOST: orbit-mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: {{ .Values.orbit.user | quote }}
  MYSQL_DATABASE: {{ .Values.orbit.database | quote }}
  CONSTELLATION_FILEPATH: config/constellation.yaml
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: {{ .Values.rabbitmq.user | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-mysql
spec:
  selector:
    matchLabels:
      app: orbit-mysql
  template:
    metadata:
      labels:
        app: orbit-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              value: {{ .Values.orbit.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.orbit.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orbit
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-mysql
spec:
  selector:
    app: orbit-mysql
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-app
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orbit-app
  template:
    metadata:
      labels:
        app: orbit-app
    spec:
      enableServiceLinks: false
      initContainers:
        {{- include "satellogic.waitFor" (dict "image" .Values.images.orbit "targets" (list "orbit-mysql:3306" "rabbitmq:5672")) | nindent 8 }}
        - name: migrate
          image: {{ .Values.images.orbit }}
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: orbit
            - secretRef:
                name: orbit
      containers:
        - name: orbit-app
          image: {{ .Values.images.orbit }}
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: orbit
            - secretRef:
                name: orbit
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-app
spec:
  type: NodePort
  selector:
    app: orbit-app
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30081
