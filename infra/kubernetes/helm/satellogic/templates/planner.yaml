apiVersion: v1
kind: Secret
metadata:
  name: planner
stringData:
  MYSQL_PASSWORD: {{ .Values.planner.password | quote }}
  RABBITMQ_PASSWORD: {{ .Values.rabbitmq.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: planner
data:
  MYSQL_HOST: planner-mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: {{ .Values.planner.user | quote }}
  MYSQL_DATABASE: {{ .Values.planner.database | quote }}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: {{ .Values.rabbitmq.user | quote }}
  BASE_ORBIT_EXECUTION_URL: http://orbit-app:8080/api/v1/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-mysql
spec:
  selector:
    matchLabels:
      app: planner-mysql
  template:
    metadata:
      labels:
        app: planner-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              value: {{ .Values.planner.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.planner.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planner
                  key: MYSQL_PASSWORD
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: planner-mysql
spec:
  selector:
    app: planner-mysql
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-app
spec:
  selector:
    matchLabels:
      app: planner-app
  template:
    metadata:
      labels:
        app: planner-app
      annotations:
        rollme: {{ .Values.rollme | quote }}
    spec:
      enableServiceLinks: false
      initContainers:
        {{- include "satellogic.waitFor" (dict "image" .Values.images.planner "targets" (list "planner-mysql:3306")) | nindent 8 }}
        - name: migrate
          image: {{ .Values.images.planner }}
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: planner
            - secretRef:
                name: planner
      containers:
        - name: planner-app
          image: {{ .Values.images.planner }}
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: planner
            - secretRef:
                name: planner
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: planner-app
spec:
  type: NodePort
  selector:
    app: planner-app
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-worker
spec:
  replicas: {{ .Values.planner.workerReplicas }}
  selector:
    matchLabels:
      app: planner-worker
  template:
    metadata:
      labels:
        app: planner-worker
      annotations:
        rollme: {{ .Values.rollme | quote }}
    spec:
      enableServiceLinks: false
      initContainers:
        {{- include "satellogic.waitFor" (dict "image" .Values.images.planner "targets" (list "planner-mysql:3306" "rabbitmq:5672")) | nindent 8 }}
      containers:
        - name: planner-worker
          image: {{ .Values.images.planner }}
          imagePullPolicy: Never
          command: ["python", "-m", "src.worker"]
          envFrom:
            - configMapRef:
                name: planner
            - secretRef:
                name: planner
