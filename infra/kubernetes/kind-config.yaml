kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: satellogic
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 30081
        hostPort: 8081
        listenAddress: "127.0.0.1"
      - containerPort: 31672
        hostPort: 15672
        listenAddress: "127.0.0.1"
