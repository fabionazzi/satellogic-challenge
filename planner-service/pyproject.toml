[project]
name = "planner-service"
version = "0.1.0"
description = "Planner service"
authors = [
    {name = "Fabio Nazzi",email = "fabionnazzi@gmail.com"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi (>=0.162.7,<0.163.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "aiomysql (>=0.3.2,<0.4.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aio-pika (>=10.2.3,<11.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
